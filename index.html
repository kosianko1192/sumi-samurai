<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="笠をかぶった侍が、秋・雪・桜の山路を昼も夜も歩き続ける水墨画。">
<title>墨ノ道</title>
<style>
  :root{
    --paper:#ECE8DF;
    --ink:#1A181D;
    color-scheme: light;
  }
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);overflow:hidden}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block}

  .loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--paper);transition:opacity 1.4s ease;z-index:5}
  .loading.done{opacity:0;pointer-events:none}

</style>
</head>
<body>
<canvas id="scene" role="img" aria-label="水墨画で描かれた、笠をかぶった侍が秋の山路を歩く情景"></canvas>

<div class="loading" id="loading"></div>

<script>
(() => {
'use strict';

/* ================================================================
   基本ユーティリティ
   ================================================================ */
const INK = [26, 24, 29];
const PAPER = [236, 232, 223];
const SHU = [178, 58, 43];
const SAKURA = [228, 160, 172];
const SNOW = [250, 248, 242];
const inkA = a => `rgba(26,24,29,${a < 0 ? 0 : a > 1 ? 1 : a.toFixed(3)})`;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const V = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1]],
  mul: (a, s) => [a[0] * s, a[1] * s],
  lerp: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t],
  norm: a => { const l = Math.hypot(a[0], a[1]) || 1; return [a[0] / l, a[1] / l]; },
  rot: (a, t) => { const c = Math.cos(t), s = Math.sin(t); return [a[0] * c - a[1] * s, a[0] * s + a[1] * c]; },
};
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash1(i, seed) { let h = Math.imul(i, 374761393) + Math.imul(seed, 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function noise1(x, seed) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return hash1(i, seed) * (1 - u) + hash1(i + 1, seed) * u; }
function noise1p(x, per, seed) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); const a = ((i % per) + per) % per, b = (((i + 1) % per) + per) % per; return hash1(a, seed) * (1 - u) + hash1(b, seed) * u; }
function fbm1p(x, per, seed, oct) { let s = 0, a = .5, n = 0; for (let o = 0; o < oct; o++) { s += a * noise1p(x, per, seed + o * 101); n += a; x *= 2; per *= 2; a *= .5; } return s / n; }
function hash2(i, j, seed) { let h = Math.imul(i, 374761393) + Math.imul(j, 668265263) + Math.imul(seed, 982451653) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function noise2(x, y, seed, per) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  let x0 = xi, x1 = xi + 1;
  if (per) { x0 = ((x0 % per) + per) % per; x1 = ((x1 % per) + per) % per; }
  const a = hash2(x0, yi, seed), b = hash2(x1, yi, seed), c = hash2(x0, yi + 1, seed), d = hash2(x1, yi + 1, seed);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm2(x, y, seed, per, oct) { let s = 0, a = .5, n = 0; for (let o = 0; o < oct; o++) { s += a * noise2(x, y, seed + o * 57, per); n += a; x *= 2; y *= 2; per *= 2; a *= .5; } return s / n; }
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };
const tick = () => new Promise(r => setTimeout(r, 0));

/* ================================================================
   筆エンジン — 穂先の毛一本一本を描き、かすれ・にじみを出す
   ================================================================ */
const BR = { px: 1 };   // 1 描画単位あたりのデバイスピクセル

function sampleCurve(pts, closed) {
  const step = 2.2 / BR.px, n = pts.length, out = [];
  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const p0 = pts[closed ? (i - 1 + n) % n : Math.max(i - 1, 0)], p1 = pts[i],
      p2 = pts[closed ? (i + 1) % n : i + 1], p3 = pts[closed ? (i + 2) % n : Math.min(i + 2, n - 1)];
    const len = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
    const m = Math.max(1, Math.min(240, Math.ceil(len / step)));
    for (let k = 0; k < m; k++) {
      const t = k / m, t2 = t * t, t3 = t2 * t;
      out.push([
        .5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
        .5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)
      ]);
    }
  }
  if (!closed) out.push(pts[n - 1]);
  return out;
}

/* 一筆: w 太さ, a 墨の濃さ, dry かすれ, t0/c0 起筆, t1/c1 収筆 */
function brush(g, pts, o) {
  const P = sampleCurve(pts, false), n = P.length;
  if (n < 2) return;
  const L = new Float32Array(n);
  for (let i = 1; i < n; i++) L[i] = L[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]);
  const tot = L[n - 1]; if (tot <= 1e-4) return;
  const k = BR.px, w = o.w, a = o.a ?? .9, dry = o.dry ?? .15, seed = o.seed ?? 7, rough = o.rough ?? .22;
  const col = o.rgb ? al => `rgba(${o.rgb},${al < 0 ? 0 : al > 1 ? 1 : al.toFixed(3)})` : inkA;
  const t0 = o.t0 ?? .12, t1 = o.t1 ?? .4, c0 = o.c0 ?? .45, c1 = o.c1 ?? .04;
  const NX = new Float32Array(n), NY = new Float32Array(n), HW = new Float32Array(n);
  const LX = new Float32Array(n), LY = new Float32Array(n), RX = new Float32Array(n), RY = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const a0 = P[Math.max(i - 1, 0)], a1 = P[Math.min(i + 1, n - 1)];
    let tx = a1[0] - a0[0], ty = a1[1] - a0[1]; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
    const nx = -ty, ny = tx, t = L[i] / tot;
    let pr = 1;
    if (t < t0) pr = c0 + (1 - c0) * Math.sin(t / t0 * Math.PI / 2);
    if (t > 1 - t1) { const u = (t - (1 - t1)) / t1; pr *= c1 + (1 - c1) * Math.pow(1 - u, .85); }
    if (o.press) pr *= o.press(t);
    const hw = w * .5 * pr, s = L[i] * k;
    const eL = 1 + rough * ((noise1(s * .09, seed) * 2 - 1) + .5 * (noise1(s * .38, seed + 3) * 2 - 1));
    const eR = 1 + rough * ((noise1(s * .09, seed + 11) * 2 - 1) + .5 * (noise1(s * .38, seed + 5) * 2 - 1));
    NX[i] = nx; NY[i] = ny; HW[i] = hw;
    LX[i] = P[i][0] + nx * hw * eL; LY[i] = P[i][1] + ny * hw * eL;
    RX[i] = P[i][0] - nx * hw * eR; RY[i] = P[i][1] - ny * hw * eR;
  }
  // 墨だまり(芯)
  const coreA = a * (1 - dry * .88) * (o.core ?? .78);
  if (coreA > .008) {
    g.beginPath(); g.moveTo(LX[0], LY[0]);
    for (let i = 1; i < n; i++) g.lineTo(LX[i], LY[i]);
    for (let i = n - 1; i >= 0; i--) g.lineTo(RX[i], RY[i]);
    g.closePath(); g.fillStyle = col(coreA); g.fill();
  }
  // 穂先の毛
  const nb = o.nb ?? clamp(Math.round(w * k * .5), 4, 18);
  const r = mulberry32(seed * 9973 + 17);
  const lwBase = Math.max(.55 / k, w / nb * 1.1);
  g.lineCap = 'round'; g.lineJoin = 'round';
  for (let b = 0; b < nb; b++) {
    const off = ((b + .5) / nb * 2 - 1) * .93 + (r() - .5) * .45 / nb;
    const inkq = .35 + .65 * r(), edge = Math.abs(off);
    const lw = lwBase * (.5 + .8 * r()), bs = seed * 31 + b * 7, fr = .05 + r() * .06, ph = r() * 50;
    g.beginPath(); let on = false;
    for (let i = 0; i < n; i++) {
      const t = L[i] / tot;
      const th = dry * (.12 + .88 * Math.pow(t, 1.25)) + edge * dry * .32;
      if (noise1(L[i] * k * fr + ph, bs) > th) {
        const h = HW[i] * off, x = P[i][0] + NX[i] * h, y = P[i][1] + NY[i] * h;
        if (!on) { g.moveTo(x, y); on = true; } else g.lineTo(x, y);
      } else on = false;
    }
    g.strokeStyle = col(a * inkq * (o.bm ?? .62)); g.lineWidth = lw; g.stroke();
  }
}

/* 淡墨の面(にじみ縁つき) */
function wash(g, pts, o = {}) {
  const P = sampleCurve(pts, true), n = P.length; if (n < 3) return;
  const k = BR.px, seed = o.seed || 3, ro = o.rough ?? .6;
  g.beginPath(); let s = 0;
  for (let i = 0; i < n; i++) {
    const a0 = P[(i - 1 + n) % n], a1 = P[(i + 1) % n];
    const tx = a1[0] - a0[0], ty = a1[1] - a0[1], tl = Math.hypot(tx, ty) || 1;
    if (i) s += Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]);
    const sp = s * k;
    const d = ro * ((noise1(sp * .035, seed) - .5) * 2 + .45 * (noise1(sp * .16, seed + 9) - .5) * 2);
    const x = P[i][0] - ty / tl * d, y = P[i][1] + tx / tl * d;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.closePath();
  if (o.erase) { g.save(); g.globalCompositeOperation = 'destination-out'; g.fillStyle = `rgba(0,0,0,${o.erase})`; g.fill(); g.restore(); }
  g.fillStyle = o.fill || inkA(o.a ?? .4); g.fill();
  if (o.rim) { g.lineWidth = o.rim; g.lineJoin = 'round'; g.strokeStyle = inkA((o.a ?? .4) * (o.rimA ?? .7)); g.stroke(); }
}
function erase(g, fn) { g.save(); g.globalCompositeOperation = 'destination-out'; fn(); g.restore(); }
function dab(g, x, y, s, a, seed, ang = .6) {
  brush(g, [[x - Math.cos(ang) * s * .35, y - Math.sin(ang) * s * .35], [x + Math.cos(ang) * s * .35, y + Math.sin(ang) * s * .35]],
    { w: s, a, dry: .12, seed, t0: .45, c0: .75, t1: .5, c1: .35, nb: 4, rough: .3 });
}
/* 縮小→拡大による柔らかなにじみを下に敷く */
function bleedify(c, amt = .35, div = 5) {
  const s = mk(c.width / div, c.height / div), sg = s.getContext('2d');
  sg.drawImage(c, 0, 0, s.width, s.height);
  const g = c.getContext('2d'); g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'destination-over'; g.globalAlpha = amt;
  g.drawImage(s, 0, 0, c.width, c.height); g.restore();
}

/* 積雪 — 墨の形の上端に紙の白を積もらせた層を作る */
function snowCaps(src, depth, seed, thr = 30, ridgeOnly = false) {
  const w = src.width, h = src.height, d = src.getContext('2d').getImageData(0, 0, w, h).data;
  const out = mk(w, h), og = out.getContext('2d'), od = og.createImageData(w, h), o = od.data;
  for (let x = 0; x < w; x++) {
    const dep = depth * (.45 + 1.1 * noise1(x * .018, seed) * (.75 + .25 * noise1(x * .09, seed + 9))), str = .78 + .22 * noise1(x * .06, seed + 5);
    let run = 1e9, seen = false;
    for (let y = 0; y < h; y++) {
      const i = (y * w + x) * 4, a = d[i + 3];
      if (a < thr) { if (!(ridgeOnly && seen)) run = -1; continue; }
      if (ridgeOnly && run < 0) seen = true;
      run = run < 0 ? 0 : run + 1;
      if (run < dep) {
        const f = Math.pow(1 - run / dep, .55);
        o[i] = SNOW[0]; o[i + 1] = SNOW[1]; o[i + 2] = SNOW[2]; o[i + 3] = Math.min(255, 255 * f * str * (ridgeOnly ? .92 : Math.min(1, a / 255 * 2.4)));
      }
    }
  }
  og.putImageData(od, 0, 0);
  return out;
}
/* 色つきの小さな滲み玉 */
function blob(g, x, y, s, fill, seed, rough = .22) {
  const pts = [];
  for (let k = 0; k < 7; k++) { const t = k / 7 * Math.PI * 2; pts.push([x + Math.cos(t) * s, y + Math.sin(t) * s * .82]); }
  wash(g, pts, { fill, rough: s * rough, seed });
}

/* ================================================================
   画題: 松・岩・芒
   ================================================================ */
function paintNeedles(g, cx, cy, s, r, a) {
  const cloud = [];
  for (let k = 0; k < 10; k++) { const t = k / 10 * Math.PI * 2; cloud.push([cx + Math.cos(t) * s * 1.3 * (.85 + r() * .3), cy + s * .12 + Math.sin(t) * s * .42 * (.8 + r() * .4)]); }
  wash(g, cloud, { a: .17 * a, rough: s * .14, seed: Math.floor(r() * 1e4) });
  const fans = 2 + Math.floor(r() * 2);
  for (let f = 0; f < fans; f++) {
    const x0 = cx + (f - (fans - 1) / 2) * s * .85 + (r() - .5) * s * .3, y0 = cy + (r() - .5) * s * .2;
    const m = 9 + Math.floor(r() * 5);
    for (let j = 0; j < m; j++) {
      const ang = -Math.PI * (.06 + .88 * j / (m - 1)) + (r() - .5) * .09;
      const L = s * (.7 + r() * .35) * (.72 + .28 * Math.sin(Math.PI * j / (m - 1)));
      brush(g, [[x0, y0], [x0 + Math.cos(ang) * L, y0 + Math.sin(ang) * L]],
        { w: Math.max(.9, s * .075), a: .82 * a, dry: .22, seed: Math.floor(r() * 1e5), t0: .02, c0: .85, t1: .75, c1: 0, nb: 2, rough: .1 });
    }
  }
}
function paintPine(g, seed, a = 1) {
  const r = mulberry32(seed);
  const lean = (r() - .5) * 40, h = 80 + r() * 16;
  const tr = [[0, 0], [lean * .08 + (r() - .5) * 8, -h * .25], [lean * .42 + (r() - .5) * 11, -h * .5], [lean * .75 + (r() - .5) * 8, -h * .76], [lean, -h]];
  const TP = sampleCurve(tr, false);
  const at = t => TP[Math.min(TP.length - 1, Math.max(0, Math.floor(t * (TP.length - 1))))];
  brush(g, [[-11, 1], [-4, -1.5], at(.09)], { w: 3, a: .75 * a, dry: .6, seed: seed + 2, t1: .3 });
  brush(g, [[10, 1.5], [3, -1], at(.07)], { w: 2.6, a: .7 * a, dry: .6, seed: seed + 5, t1: .3 });
  brush(g, tr, { w: 8.5, a: .5 * a, dry: .78, seed: seed + 3, t0: .02, c0: 1, t1: .35, c1: .35, rough: .4, nb: 14 });
  const off = (pts, d) => pts.map(p => [p[0] + d, p[1]]);
  brush(g, off(tr, -3.9), { w: 2.3, a: .92 * a, dry: .42, seed: seed + 4, t0: .05, c0: .8, t1: .3, c1: .4 });
  brush(g, off(tr, 3.6).slice(0, 4), { w: 1.8, a: .8 * a, dry: .55, seed: seed + 6, t0: .05, c0: .8, t1: .4, c1: .2 });
  for (let i = 0; i < 16; i++) {
    const p = at(.05 + r() * .82), x = p[0] + (r() - .5) * 5;
    brush(g, [[x - 1.6, p[1]], [x, p[1] - 1.3], [x + 1.7, p[1] - .2]], { w: 1.1, a: .72 * a, dry: .3, seed: seed + 10 + i, nb: 3 });
  }
  const nbr = 4 + Math.floor(r() * 3);
  for (let i = 0; i < nbr; i++) {
    const t = Math.min(.97, .38 + .57 * (i / (nbr - 1)) + (r() - .5) * .06), b = at(t);
    const side = (i % 2 ? 1 : -1) * (r() < .18 ? -1 : 1);
    const len = (1.15 - t) * 58 + r() * 18, droop = (r() - .3) * 10;
    const pts = [b, [b[0] + side * len * .35, b[1] - len * .12 + droop * .3], [b[0] + side * len * .7, b[1] - len * .05 + droop * .7], [b[0] + side * len, b[1] + droop - len * .08]];
    brush(g, pts, { w: 3.3 * (1.1 - t * .4), a: .88 * a, dry: .48, seed: seed + 30 + i, t0: .05, c0: 1, t1: .6, c1: .2 });
    paintNeedles(g, pts[3][0], pts[3][1] - 1.5, 13 * (.8 + r() * .4), r, a);
    paintNeedles(g, pts[2][0], pts[2][1] - 1.5, 10 * (.8 + r() * .4), r, a);
    if (r() < .55) paintNeedles(g, (pts[1][0] + pts[2][0]) / 2, pts[1][1] - 2, 8 + r() * 3, r, a);
  }
  const top = at(1); paintNeedles(g, top[0], top[1] - 1, 15, r, a);
}
function paintRock(g, seed, a = 1) {
  const r = mulberry32(seed);
  const wv = 45 + r() * 15, hv = 30 + r() * 20;
  const top = [[-wv, 0], [-wv * .85, -hv * .45], [-wv * .5, -hv * .85], [-wv * .1, -hv], [wv * .35, -hv * .8], [wv * .75, -hv * .45], [wv, 0]]
    .map((p, i) => [p[0] + (r() - .5) * 6, (i === 0 || i === 6) ? 0 : p[1] + (r() - .5) * 5]);
  wash(g, [...top, [0, 2]], { a: .15 * a, rough: 1.5, seed: seed + 1 });
  wash(g, [top[3], top[4], top[5], top[6], [wv * .2, 0], [wv * .05, -hv * .5]], { a: .2 * a, rough: 2, seed: seed + 2 });
  brush(g, top.slice(0, 4), { w: 3.3, a: .9 * a, dry: .5, seed: seed + 3, t0: .1, c0: .7, t1: .35 });
  brush(g, top.slice(3), { w: 2.8, a: .86 * a, dry: .6, seed: seed + 4, t0: .1, c0: .7, t1: .35 });
  brush(g, [[-wv * .2, -hv * .82], [-wv * .05, -hv * .42], [wv * .12, -hv * .05]], { w: 1.8, a: .7 * a, dry: .5, seed: seed + 5 });
  for (let i = 0; i < 6; i++) {
    const x = (r() - .3) * wv * 1.2, y0 = -hv * (.3 + r() * .5);
    brush(g, [[x, y0], [x + 6 + r() * 6, y0 + 10 + r() * 10]], { w: 5 + r() * 4, a: .32 * a, dry: .82, seed: seed + 20 + i, c0: 1, t1: .6 });
  }
  for (let i = 0; i < 10; i++) {
    const j = Math.floor(r() * 5) + 1, p = V.lerp(top[j], top[j + 1], r());
    dab(g, p[0], p[1] - 1.5, 3 + r() * 1.6, .85 * a, seed + 40 + i);
  }
  for (let i = 0; i < 7; i++) {
    const x = (r() - .5) * wv * 2.1, hh = 5 + r() * 10, lean = (r() - .5) * 6;
    brush(g, [[x, 1], [x + lean * .5, 1 - hh * .5], [x + lean, 1 - hh]], { w: 1.2, a: .6 * a, dry: .3, seed: seed + 60 + i, t0: .05, c0: .9, t1: .8, c1: 0, nb: 3 });
  }
}
function paintSusuki(g, seed, a = 1) {
  const r = mulberry32(seed);
  const nb = 10 + Math.floor(r() * 6);
  for (let i = 0; i < nb; i++) {
    const side = r() - .35, h = 90 + r() * 90, bend = side * 90;
    const x0 = (r() - .5) * 12;
    const pts = [[x0, 0], [x0 + bend * .12, -h * .4], [x0 + bend * .5, -h * .78], [x0 + bend, -h * .95 + Math.abs(bend) * .35]];
    brush(g, pts, { w: 2.4 + r() * 2.2, a: a * (.55 + .4 * r()), dry: .25 + .3 * r(), t0: .04, c0: 1, t1: .85, c1: 0, seed: seed + i });
  }
  const ns = 3 + Math.floor(r() * 3);
  for (let i = 0; i < ns; i++) {
    const x0 = (r() - .5) * 16, h = 150 + r() * 38, lean = (r() - .45) * 34;
    const topP = [x0 + lean, -h];
    brush(g, [[x0, 0], [x0 + lean * .3, -h * .5], topP], { w: 1.4, a: .8 * a, dry: .3, t0: .02, c0: 1, t1: .1, c1: .7, seed: seed + 50 + i });
    const dir = lean >= 0 ? 1 : -1;
    const rach = [topP, [topP[0] + dir * 8, topP[1] + 6], [topP[0] + dir * 13, topP[1] + 18], [topP[0] + dir * 15, topP[1] + 32]];
    brush(g, rach, { w: 1.1, a: .7 * a, dry: .35, t0: .05, c0: 1, t1: .6, c1: 0, seed: seed + 70 + i });
    const RP = sampleCurve(rach, false);
    for (let j = 0; j < 16; j++) {
      const p = RP[Math.floor(j / 16 * (RP.length - 1))], ang = Math.PI / 2 + dir * (-.2 - r() * .9), L = 9 + r() * 12;
      brush(g, [p, [p[0] + Math.cos(ang) * L * .5 + dir * 2, p[1] + Math.sin(ang) * L * .5], [p[0] + Math.cos(ang) * L + dir * 3, p[1] + Math.sin(ang) * L]],
        { w: .9, a: .42 * a, dry: .4, t0: .02, c0: .8, t1: .8, c1: 0, nb: 2, seed: seed + 100 + i * 20 + j });

}
/* 桜 — 渇いた幹から枝分かれし、枝先に淡紅の花房 */
function paintSakura(g, seed, a = 1) {
  const r = mulberry32(seed), tips = [], mids = [];
  const branch = (x, y, ang, len, w, depth) => {
    const bend = (r() - .5) * .55;
    const mx = x + Math.cos(ang + bend * .5) * len * .5, my = y + Math.sin(ang + bend * .5) * len * .5;
    const ex = x + Math.cos(ang + bend) * len, ey = y + Math.sin(ang + bend) * len;
    brush(g, [[x, y], [mx, my], [ex, ey]], { w, a: .9 * a, dry: .5, seed: Math.floor(r() * 1e5), t0: .05, c0: 1, t1: depth ? .2 : .75, c1: depth ? .7 : .1, rough: .35 });
    if (depth <= 0 || len < 5) { tips.push([ex, ey]); return; }
    if (depth <= 2) mids.push([mx, my]);
    const n = 2 + (r() < .35 ? 1 : 0);
    for (let i = 0; i < n; i++) branch(ex, ey, ang + bend + (i - (n - 1) / 2) * (.55 + r() * .35) + (r() - .5) * .2, len * (.62 + r() * .18), w * .62, depth - 1);
  };
  brush(g, [[-10, 1.5], [-3, -1], [0, -6]], { w: 3, a: .7 * a, dry: .6, seed: seed + 1, t1: .3 });
  brush(g, [[9, 1.5], [3, -.5], [0, -5]], { w: 2.6, a: .7 * a, dry: .6, seed: seed + 2, t1: .3 });
  branch(0, 0, -Math.PI / 2 + (r() - .5) * .35, 34 + r() * 8, 9, 4);
  const pk = al => `rgba(${SAKURA},${al.toFixed(3)})`;
  for (const [x, y] of tips.concat(mids)) if (r() < .75) blob(g, x + (r() - .5) * 6, y + (r() - .5) * 4, 8 + r() * 9, pk(.2 * a), Math.floor(r() * 1e5), .3);
  for (const [x, y] of tips) {
    for (let k = 0; k < 6; k++) blob(g, x + (r() - .5) * 14, y + (r() - .5) * 10, 1.6 + r() * 1.8, pk((.45 + r() * .3) * a), Math.floor(r() * 1e5));
    for (let k = 0; k < 2; k++) dab(g, x + (r() - .5) * 10, y + (r() - .5) * 8, 1.2, .75 * a, Math.floor(r() * 1e5));
  }
}
/* 焚火の薪 — 太い丸太を寄せて組み、手前の切り口に年輪 */
function paintLogs(g, seed, a = 1) {
  const r = mulberry32(seed);
  const log = (x0, y0, x1, y1, w, cap) => {
    const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, nx = -uy, ny = ux;
    const P = (t, o) => [x0 + dx * t + nx * o, y0 + dy * t + ny * o];
    const sd = Math.floor(r() * 1e5);
    wash(g, [P(0, -w / 2), P(.5, -w / 2 - .3), P(1, -w / 2), P(1, w / 2), P(.5, w / 2 + .2), P(0, w / 2)], { a: .2 * a, rough: .35, seed: sd });
    wash(g, [P(0, 0), P(1, .2), P(1, w / 2), P(0, w / 2)], { a: .28 * a, rough: .3, seed: sd + 1 });
    for (let k = 0; k < 6; k++) {
      const o = (r() - .5) * w * .8, t0 = r() * .5, t1 = t0 + .3 + r() * .5;
      brush(g, [P(t0, o), P((t0 + t1) / 2, o + (r() - .5) * .6), P(Math.min(1, t1), o + (r() - .5) * .6)], { w: .45 + r() * .4, a: .6 * a, dry: .6, seed: sd + 10 + k, nb: 3 });
    }
    brush(g, [P(0, -w / 2), P(.5, -w / 2 - .25), P(1, -w / 2)], { w: .95, a: .92 * a, dry: .45, seed: sd + 2, t0: .05, c0: .8, t1: .2, c1: .5 });
    brush(g, [P(0, w / 2), P(.5, w / 2 + .2), P(1, w / 2)], { w: 1.3, a: .95 * a, dry: .35, seed: sd + 3, t0: .05, c0: .8, t1: .2, c1: .5 });
    if (cap) {
      // 切り口: 丸太の向きに潰れた楕円と年輪
      const ring = (sc, ww, al, s2) => {
        const pts = [];
        for (let k = 0; k <= 12; k++) { const q = k / 12 * Math.PI * 2; pts.push([x0 + ux * Math.cos(q) * w * .26 * sc + nx * Math.sin(q) * w * .5 * sc, y0 + uy * Math.cos(q) * w * .26 * sc + ny * Math.sin(q) * w * .5 * sc]); }
        brush(g, pts, { w: ww, a: al * a, dry: .4, seed: s2, t0: .05, c0: .8, t1: .1, c1: .7, nb: 3 });
        return pts;
      };
      const outer = [];
      for (let k = 0; k < 12; k++) { const q = k / 12 * Math.PI * 2; outer.push([x0 + ux * Math.cos(q) * w * .26 + nx * Math.sin(q) * w * .5, y0 + uy * Math.cos(q) * w * .26 + ny * Math.sin(q) * w * .5]); }
      wash(g, outer, { fill: `rgba(${PAPER},${(.9 * a).toFixed(3)})`, rough: .15, seed: sd + 4 });
      wash(g, outer, { a: .12 * a, rough: .2, seed: sd + 5 });
      ring(1, 1.1, .95, sd + 6); ring(.62, .45, .6, sd + 7); ring(.3, .4, .55, sd + 8);
      dab(g, x0, y0, .8, .7 * a, sd + 9);
    }
  };
  // 奥の丸太 → 中心の立て木 → 手前の丸太
  log(-24, 3, 3, -15, 5, false);
  log(24, 2, -3, -16, 5, false);
  log(-1, 5, 1, -19, 4.2, false);
  log(-30, 5.5, -7, 1.5, 5, true);
  log(31, 6, 8, 2.5, 5, true);
  log(-19, 7.5, 5, -10, 5.6, true);
  log(20, 8.2, -5, -10.5, 5.6, true);
  // 燠と小石・小枝
  for (let i = 0; i < 12; i++) dab(g, (r() - .5) * 22, 2 - r() * 7, .9 + r() * 1.6, .85 * a, seed + 90 + i);
  for (let i = 0; i < 7; i++) { const x = (r() < .5 ? -1 : 1) * (22 + r() * 14), y = 7 + r() * 3; blob(g, x, y, 1.4 + r() * 1.4, inkA(.55 * a), seed + 120 + i, .3); }
  for (let i = 0; i < 4; i++) { const x = (r() - .5) * 60, y = 8 + r() * 2; brush(g, [[x, y], [x + 5 + r() * 6, y - 1 - r() * 2], [x + 10 + r() * 6, y - 2 + r() * 2]], { w: .6, a: .7 * a, dry: .5, seed: seed + 140 + i, nb: 3 }); }
}

function makeSprite(paint, seed, box, ppu, res, alpha = 1) {
  const s = ppu * res;
  const c = mk((box[2] - box[0]) * s, (box[3] - box[1]) * s), g = c.getContext('2d');
  g.setTransform(s, 0, 0, s, -box[0] * s, -box[1] * s);
  BR.px = s;
  paint(g, seed, alpha);
  bleedify(c, .4, 5);
  return { c, ax: -box[0] * ppu, ay: -box[1] * ppu, w: (box[2] - box[0]) * ppu, h: (box[3] - box[1]) * ppu };
}

/* ================================================================
   画面・資産
   ================================================================ */
const cv = document.getElementById('scene');
const ctx = cv.getContext('2d');
let W = 0, H = 0, dpr = 1, groundY = 0, figX = 0, U = 1;
let A = null;           // 事前に描いた資産
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

function buildPaper() {
  const c = mk(W, H), g = c.getContext('2d');
  g.fillStyle = `rgb(${PAPER})`; g.fillRect(0, 0, W, H);
  // 紙の大きなむら
  const s = mk(W / 8, H / 8), sw = s.width, sh = s.height, sg = s.getContext('2d'), id = sg.createImageData(sw, sh);
  for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
    const v = fbm2(x / 14, y / 14, 31, 0, 4), k = (y * sw + x) * 4;
    id.data[k] = 120; id.data[k + 1] = 105; id.data[k + 2] = 85; id.data[k + 3] = clamp((v - .42) * 60, 0, 22);
  }
  sg.putImageData(id, 0, 0); g.drawImage(s, 0, 0, W, H);
  // 天の淡墨
  const gr = g.createLinearGradient(0, 0, 0, H * .42);
  gr.addColorStop(0, inkA(.11)); gr.addColorStop(.55, inkA(.03)); gr.addColorStop(1, inkA(0));
  g.fillStyle = gr; g.fillRect(0, 0, W, H * .42);
  return c;
}

/* 朱の日 */
function buildSun(scx, scy, sr) {
  const bw = Math.ceil(sr * 2.6), sc = mk(bw, bw), sgc = sc.getContext('2d'), sid = sgc.createImageData(bw, bw);
  for (let y = 0; y < bw; y++) for (let x = 0; x < bw; x++) {
    const dx = x - bw / 2, dy = y - bw / 2, d = Math.hypot(dx, dy) / sr;
    const n = fbm2(x / 7, y / 7, 5, 0, 3), n2 = fbm2(x / 2.5, y / 9, 8, 0, 2);
    const edge = 1 - sstep(.93, 1.02, d + (n - .5) * .09);
    const ring = Math.exp(-Math.max(0, 1 - d) * sr / 2.6) * .22;
    const al = edge * (.62 + .3 * (n2 - .5) * 2 + ring) + (1 - edge) * Math.exp(-Math.max(0, d - 1) * sr / 4) * .1;
    const k = (y * bw + x) * 4;
    sid.data[k] = SHU[0]; sid.data[k + 1] = SHU[1]; sid.data[k + 2] = SHU[2]; sid.data[k + 3] = clamp(al, 0, .9) * 255;
  }
  sgc.putImageData(sid, 0, 0);
  return { c: sc, x: scx, y: scy, r: sr };
}
/* 月 — 紙の白を塗り残したような円に、淡い影 */
function buildMoon(mx, my, r) {
  const bw = Math.ceil(r * 2.4), c = mk(bw, bw), g = c.getContext('2d'), id = g.createImageData(bw, bw);
  for (let y = 0; y < bw; y++) for (let x = 0; x < bw; x++) {
    const d = Math.hypot(x - bw / 2, y - bw / 2) / r, n = fbm2(x / 8, y / 8, 17, 0, 4);
    const edge = 1 - sstep(.95, 1.02, d + (n - .5) * .04);
    const v = 248 - Math.max(0, n - .47) * 70, k = (y * bw + x) * 4;
    id.data[k] = v; id.data[k + 1] = v - 2; id.data[k + 2] = v - 9; id.data[k + 3] = edge * 255;
  }
  g.putImageData(id, 0, 0);
  return { c, x: mx, y: my, r };
}

function buildGrain() {
  const c = mk(W, H), g = c.getContext('2d'), id = g.createImageData(c.width, c.height), d = id.data;
  const r = mulberry32(99);
  for (let i = 0; i < d.length; i += 4) {
    const q = r(); let v = 255 - q * q * q * 26;
    if (q > .9985) v -= 50;
    d[i] = v; d[i + 1] = v - 1; d[i + 2] = v - 4; d[i + 3] = 255;
  }
  g.putImageData(id, 0, 0);
  // 楮の繊維
  g.lineCap = 'round';
  const nf = Math.floor(W * H / 2600);
  for (let i = 0; i < nf; i++) {
    const x = r() * W, y = r() * H, L = 8 + r() * 36, an = r() * Math.PI;
    g.strokeStyle = `rgba(150,138,118,${.05 + r() * .09})`; g.lineWidth = .4 + r() * .6;
    g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo(x + Math.cos(an) * L * .5 + (r() - .5) * 8, y + Math.sin(an) * L * .5 + (r() - .5) * 8, x + Math.cos(an) * L, y + Math.sin(an) * L);
    g.stroke();
  }
  // 古びた縁
  g.globalCompositeOperation = 'multiply';
  const vg = g.createRadialGradient(W / 2, H * .46, Math.min(W, H) * .3, W / 2, H / 2, Math.hypot(W, H) * .62);
  vg.addColorStop(0, 'rgb(255,255,255)'); vg.addColorStop(1, 'rgb(214,204,186)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  return c;
}

function buildRange(o) {
  const Lw = o.Lw, res = o.res, w = Math.ceil(Lw * res), h = Math.ceil(H * res);
  const sm = mk(w, h), sg = sm.getContext('2d'), id = sg.createImageData(w, h), d = id.data;
  const raw = new Float32Array(w); let mn = 1e9, mx = -1e9;
  for (let x = 0; x < w; x++) {
    const u = x / w * o.P;
    const v = fbm1p(u, o.P, o.seed, 5);
    const rr = 1 - Math.abs(2 * fbm1p(u * 2, o.P * 2, o.seed + 7, 4) - 1);
    raw[x] = Math.pow(v, o.sharp) + .2 * rr * rr;
    mn = Math.min(mn, raw[x]); mx = Math.max(mx, raw[x]);
  }
  const ridge = new Float32Array(w), smooth = new Float32Array(w);
  for (let x = 0; x < w; x++) {
    smooth[x] = o.base - (raw[x] - mn) / (mx - mn) * (o.base - o.top);
    ridge[x] = smooth[x] + (fbm1p(x / w * o.P * 18, o.P * 18, o.seed + 3, 3) - .5) * o.rug;
  }
  const cells = o.P * 4, cs = Lw / cells;
  for (let y = 0; y < h; y++) {
    const yc = y / res;
    for (let x = 0; x < w; x++) {
      const dd = yc - ridge[x];
      if (dd < -2) continue;
      const mistY = o.mistY + (noise1p(x / w * o.P * 2, o.P * 2, o.seed + 5) - .5) * o.mistVar;
      const mist = 1 - sstep(mistY - o.mistSoft, mistY + o.mistSoft * .35, yc);
      if (mist <= .004) continue;
      const u = x / w * cells;
      const t1 = fbm2(u, yc / cs, o.seed + 11, cells, 4);
      const t2 = fbm2(u * 3, yc / (cs * .9), o.seed + 23, cells * 3, 3);
      const tex = clamp((t1 - .5) * 2.1 + .5, 0, 1) * .78 + clamp((t2 - .5) * 2 + .5, 0, 1) * .22;
      const edge = clamp((dd + 1.2) / 2.2, 0, 1);
      const fall = Math.exp(-dd / o.fall), rim = Math.exp(-dd / o.rim);
      const sl = (smooth[(x + 3) % w] - smooth[(x - 3 + w) % w]) * res / 6;
      const shade = clamp(sl * .9, -.35, .6) * Math.exp(-dd / (o.fall * .8));
      const Aa = clamp(o.alpha * edge * mist * (fall * (.3 + .85 * tex) + rim * .75 * (.45 + tex) + shade * .5), 0, 1);
      const k = (y * w + x) * 4;
      d[k] = INK[0]; d[k + 1] = INK[1]; d[k + 2] = INK[2]; d[k + 3] = Aa * 255;
    }
  }
  sg.putImageData(id, 0, 0);
  const big = mk(Lw, H), g = big.getContext('2d');
  g.imageSmoothingQuality = 'high'; g.drawImage(sm, 0, 0, Lw, H);
  const ridgeAt = xc => { const xi = ((Math.floor(xc * res) % w) + w) % w; return ridge[xi]; };
  const slopeAt = xc => ridgeAt(xc + 4) - ridgeAt(xc - 4);
  const wrap = (x0, x1, fn) => { fn(0); if (x1 > Lw) { g.save(); g.translate(-Lw, 0); fn(); g.restore(); } if (x0 < 0) { g.save(); g.translate(Lw, 0); fn(); g.restore(); } };
  BR.px = 1;
  const r = mulberry32(o.seed * 7 + 1);
  // 稜線の渇筆
  if (o.ra > 0) {
    let x = r() * 60;
    while (x < Lw) {
      const len = 50 + r() * o.slen, pts = [];
      for (let xx = x; xx <= x + len; xx += 9) pts.push([xx, ridgeAt(xx) + .6]);
      const st = { w: o.rw * (.6 + r() * .8), a: o.ra * (.55 + .45 * r()), dry: .5 + r() * .38, seed: Math.floor(r() * 1e5), t0: .1, c0: .5, t1: .4 };
      wrap(x, x + len, () => brush(g, pts, st));
      x += len + 14 + r() * o.gap;
    }
  }
  // 皴法(斜面の渇いた擦り)
  for (let i = 0; i < o.cun; i++) {
    const x = r() * Lw, y0 = ridgeAt(x) + 2 + r() * 6, sl = slopeAt(x), sg2 = sl >= 0 ? 1 : -1;
    const len = 14 + r() * o.cunLen;
    const pts = [[x, y0], [x + sg2 * len * .25, y0 + len * .5], [x + sg2 * len * .38, y0 + len]];
    const st = { w: 3 + r() * 5, a: o.cunA * (.5 + r() * .5), dry: .82, seed: Math.floor(r() * 1e5), t0: .1, c0: 1, t1: .6 };
    wrap(x - len, x + len, () => brush(g, pts, st));
  }
  // 苔点
  for (let i = 0; i < o.dots; i++) {
    const x = r() * Lw, y = ridgeAt(x) - 1 + r() * 4, s = 2.2 + r() * 3.2, sd = Math.floor(r() * 1e5), al = .5 + r() * .4;
    wrap(x - 5, x + 5, () => dab(g, x, y, s, al * o.dotA, sd, .3 + r() * .6));
  }
  // 尾根の小松
  for (let i = 0; i < o.pines; i++) {
    const x = 40 + r() * (Lw - 80), sc = (.12 + r() * .1) * H / 900, sd = Math.floor(r() * 1e5);
    g.save(); g.translate(x, ridgeAt(x) + 2); g.scale(sc, sc); BR.px = sc; paintPine(g, sd, o.pineA); g.restore(); BR.px = 1;
  }
  bleedify(big, .3, 6);
  return { c: big, Lw, ridgeAt };
}

/* 山肌に置く淡い桜 */
function buildBlossoms(R, n, s0, s1, a, seed) {
  const c = mk(R.Lw, H), g = c.getContext('2d'), r = mulberry32(seed);
  BR.px = 1;
  for (let i = 0; i < n; i++) {
    const x = r() * R.Lw, y = R.ridgeAt(x) + 3 + r() * r() * H * .09, sz = s0 + r() * (s1 - s0), sd = Math.floor(r() * 1e5);
    const al = a * (.4 + .6 * r());
    const put = dx => {
      blob(g, x + dx, y, sz, `rgba(${SAKURA},${(al * .5).toFixed(3)})`, sd, .3);
      for (let k = 0; k < 3; k++) blob(g, x + dx + (r() - .5) * sz * 1.4, y + (r() - .5) * sz * .8, sz * .28, `rgba(${SAKURA},${al.toFixed(3)})`, sd + k);
    };
    put(0); if (x < s1 * 2) put(R.Lw); if (x > R.Lw - s1 * 2) put(-R.Lw);
  }
  bleedify(c, .35, 4);
  return c;
}

function buildMist(Lw, seed) {
  const res = .35, w = Math.ceil(Lw * res), h = 90, c = mk(w, h), g = c.getContext('2d'), id = g.createImageData(w, h);
  const cells = 10;
  for (let y = 0; y < h; y++) {
    const env = Math.pow(Math.sin(Math.PI * y / (h - 1)), 1.4);
    for (let x = 0; x < w; x++) {
      const v = fbm2(x / w * cells, y / h * 2.2, seed, cells, 5);
      const k = (y * w + x) * 4;
      id.data[k] = PAPER[0]; id.data[k + 1] = PAPER[1]; id.data[k + 2] = PAPER[2];
      id.data[k + 3] = sstep(.4, .72, v) * env * 235;
    }
  }
  g.putImageData(id, 0, 0);
  return { c, Lw };
}

/* 地面(歩く道) */
function buildGround(Lg) {
  const top = 70, hh = H - groundY + top, res = Math.min(dpr, 1.5);
  const c = mk(Lg * res, hh * res), g = c.getContext('2d');
  g.setTransform(res, 0, 0, res, 0, 0); BR.px = res;
  const gy = top, r = mulberry32(1234);
  const wrap = (x0, x1, fn) => { fn(); if (x1 > Lg) { g.save(); g.translate(-Lg, 0); fn(); g.restore(); } if (x0 < 0) { g.save(); g.translate(Lg, 0); fn(); g.restore(); } };
  const S = H / 900;
  // 道の淡い擦れ
  for (let i = 0; i < Lg / 22; i++) {

    const pts = [[x, y], [x + len * .5, y + (r() - .5) * 2], [x + len, y + (r() - .5) * 3]];
    const st = { w: (2 + r() * 6) * S, a: .07 + r() * .16, dry: .78 + r() * .18, seed: Math.floor(r() * 1e5), t0: .1, c0: .8, t1: .4 };

    const pts = [[x, y], [x + len * .5, y + (r() - .5) * 1.2], [x + len, y + (r() - .5) * 1.2]];
    const st = { w: (1.6 + r() * 1.8) * S, a: .32 + r() * .25, dry: .6 + r() * .25, seed: Math.floor(r() * 1e5), t0: .08, c0: .7, t1: .35 };
    wrap(x, x + len, () => brush(g, pts, st));
    x += len + (15 + r() * 90) * S;
  }
  // 道の奥の枯草
  x = r() * 30;
  while (x < Lg) {
    const n = 3 + Math.floor(r() * 5), base = gy - 3 * S;
    for (let k = 0; k < n; k++) {
      const bx = x + (r() - .5) * 10 * S, hh2 = (6 + r() * 16) * S, lean = (r() - .4) * 9 * S;
      const pts = [[bx, base], [bx + lean * .35, base - hh2 * .55], [bx + lean, base - hh2]];
      const st = { w: 1.3 * S, a: .45 + r() * .3, dry: .3, seed: Math.floor(r() * 1e5), t0: .03, c0: 1, t1: .85, c1: 0, nb: 3 };
      wrap(bx - 20, bx + 20, () => brush(g, pts, st));
    }
    x += (22 + r() * 90) * S;
  }
  // 小石
  for (let i = 0; i < Lg / 55; i++) {
    const px = r() * Lg, py = gy - 1 + r() * 16 * S, s = (1.6 + r() * 3.4) * S, sd = Math.floor(r() * 1e5), al = .3 + r() * .5;

    const px = r() * Lg, py = gy + (24 + Math.pow(r(), 1.8) * 110) * S, len = (50 + r() * 180) * S;
    const fade = 1 - (py - gy) / (140 * S);
    const pts = [[px, py], [px + len * .5, py + (r() - .5) * 3], [px + len, py + (r() - .5) * 4]];
    const st = { w: (2 + r() * 5) * S, a: (.04 + r() * .1) * fade, dry: .85, seed: Math.floor(r() * 1e5), t0: .1, c0: .8, t1: .4 };
    wrap(px, px + len, () => brush(g, pts, st));
  }
  for (let i = 0; i < Lg / 160; i++) {
    const px = r() * Lg, py = gy + (26 + r() * 60) * S, n = 3 + Math.floor(r() * 4);
    for (let k = 0; k < n; k++) {
      const bx = px + (r() - .5) * 12 * S, hh2 = (8 + r() * 18) * S, lean = (r() - .4) * 12 * S;
      const pts = [[bx, py], [bx + lean * .35, py - hh2 * .55], [bx + lean, py - hh2]];
      const st = { w: 1.4 * S, a: .25 + r() * .2, dry: .35, seed: Math.floor(r() * 1e5), t0: .03, c0: 1, t1: .85, c1: 0, nb: 3 };
      wrap(bx - 20, bx + 20, () => brush(g, pts, st));
    }
  }
  bleedify(c, .3, 5);
  return { c, Lg, top };
}

/* ================================================================
   侍 — 歩行周期(足の軌道と腰の上下)

const FIG = { S: 30, lift: 5.5, hipH: 47.2, T: 1.38, st: .6 };
const state = { p: .25, X: 0, t: 0, sf: 1, mode: 'walk', stand: 0, vx: 0, sit: 0 };

function footAt(ph) {
  ph = ((ph % 1) + 1) % 1;
  const S = FIG.S, st = FIG.st;
  if (ph < st) {
    const t = ph / st;
    return { x: S / 2 - S * t, y: 0, pitch: .55 * sstep(.62, 1, t) };
  }
  const t = (ph - st) / (1 - st), e = (1 - Math.cos(Math.PI * t)) / 2;
  return { x: -S / 2 + S * e, y: -FIG.lift * Math.sin(Math.PI * Math.pow(t, .8)), pitch: .55 * (1 - sstep(0, .5, t)) };
}
const gust = t => (noise1(t * .35, 5) - .5) * 2 + (noise1(t * 1.3, 8) - .5) * .6;

function pose() {
  const p = state.p, sb = state.stand;
  const bob = (1 - sb) * 1.05 * Math.cos(4 * Math.PI * (p - .05));
  const hip = [0, -FIG.hipH + bob + sb * .5];
  const legs = [p, p + .5].map(ph => {
    const f = footAt(ph);
    return { toe: [f.x, f.y * (1 - sb)], pitch: f.pitch * (1 - sb) };
  });

}

const layers = [];

  const tree = () => env.season === 'spring' && r() < .6 ? pick(A.sakura) : pick(A.pines);
  layers.push({ speed: .5, items: [], next: -150, alpha: .5,
    spawn(x) {

      this.items.push({ x, sp, s: (isRock ? .45 : .5) + r() * .18, y: groundY - H * .03, flip: r() < .5 });
      return (isRock ? 260 : 360) + r() * 700;
    } });

    spawn(x) {
      const isRock = r() < .45, sp = isRock ? pick(A.rocks) : tree();
      this.items.push({ x, sp, s: isRock ? .7 + r() * .3 : .92 + r() * .22, y: groundY - 5 * (H / 900), flip: r() < .5 });

    spawn(x) {

      return 1300 + r() * 2400;
    } });
}
function drawLayer(L) {
  const off = state.X * L.speed;
  while (L.next - off < W + 500) L.next += L.spawn(L.next);
  L.items = L.items.filter(it => it.x - off + it.sp.w * it.s > -400);
  ctx.globalAlpha = L.alpha;
  for (const it of L.items) {
    const x = it.x - off, s = it.s, sp = it.sp;
    ctx.save(); ctx.translate(x, it.y);
    if (L.sway) { const sk = .05 * Math.sin(state.t * 1.25 + it.ph) + .035 * gust(state.t) + .02; ctx.transform(1, 0, -sk, 1, 0, 0); }

    ctx.drawImage(sp.c, -sp.ax * s, -sp.ay * s, sp.w * s, sp.h * s);
    if (sp.snow && env.snow > .01) { ctx.globalAlpha = env.snow; ctx.drawImage(sp.snow, -sp.ax * s, -sp.ay * s, sp.w * s, sp.h * s); ctx.globalAlpha = L.alpha; }
    ctx.restore();

}
function tile(img, Lw, off, y, h) {

/* 舞うもの — 秋は落葉、春は花びら、冬は雪 */
const leaves = [];
function initLeaves() {
  leaves.length = 0;
  for (let i = 0; i < 90; i++) leaves.push(newLeaf(true));
}
function leafKind() {
  const q = Math.random() * (env.snow + env.spring + env.autumn || 1);
  return q < env.snow ? 'snow' : q < env.snow + env.spring ? 'petal' : 'leaf';
}
function newLeaf(anywhere) {
  const z = .55 + Math.random() * 1.1, kind = leafKind();
  return {
    kind, x: anywhere ? Math.random() * W : W + 20 + Math.random() * 240,
    y: anywhere ? Math.random() * H * .9 : -20 - Math.random() * H * .5,
    z, rot: Math.random() * 6.28, vr: (Math.random() - .5) * 3, flip: Math.random() * 6.28, vf: 2 + Math.random() * 4,
    s: (kind === 'snow' ? 1.6 + Math.random() * 2.2 : kind === 'petal' ? 2.2 + Math.random() * 2 : 3 + Math.random() * 3.5) * z * (H / 900),
    red: Math.random() < .18, ph: Math.random() * 10, a: .45 + Math.random() * .4,
  };
}
function drawLeaves(dt) {
  const gs = gust(state.t);
  // 雪の日は数を増やす
  const want = Math.round((reduce ? 8 : W < 640 ? 16 : 30) * (1 + env.snow * 2));
  for (let i = 0; i < leaves.length; i++) {
    const L = leaves[i];
    const slow = L.kind === 'snow' ? .45 : L.kind === 'petal' ? .8 : 1;
    L.x += (-state.vx * L.z * .9 - 26 * L.z * slow - gs * 30 * slow + Math.sin(state.t * 1.3 + L.ph) * 14) * dt;
    L.y += (16 + L.z * 16 + Math.sin(state.t * 2.1 + L.ph) * 10) * slow * dt * (H / 900);
    L.rot += L.vr * dt; L.flip += L.vf * dt;
    if (L.x < -40 || L.y > H + 30) { leaves[i] = newLeaf(false); L.dead = true; continue; }
    if (i >= want) continue;
    ctx.save(); ctx.translate(L.x, L.y);
    const s = L.s;
    if (L.kind === 'snow') {
      ctx.fillStyle = inkA(.12 * (1 - env.night)); ctx.beginPath(); ctx.arc(.4, .5, s * 1.15, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(${SNOW},${.92})`; ctx.beginPath(); ctx.arc(0, 0, s, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.rotate(L.rot); ctx.scale(1, Math.cos(L.flip));
      ctx.beginPath(); ctx.moveTo(-s, 0); ctx.quadraticCurveTo(0, -s * .62, s, 0); ctx.quadraticCurveTo(0, s * .58, -s, 0);
      if (L.kind === 'petal') { ctx.fillStyle = `rgba(${SAKURA},${(L.a * .9 + .1).toFixed(3)})`; ctx.fill(); }
      else {
        ctx.fillStyle = L.red ? `rgba(${SHU},${L.a * .8})` : inkA(L.a * .75); ctx.fill();
        ctx.strokeStyle = inkA(L.a * .5); ctx.lineWidth = .5; ctx.beginPath(); ctx.moveTo(-s * 1.3, 0); ctx.lineTo(s * .8, 0); ctx.stroke();
      }
    }
    ctx.restore();
  }
}

function drawBirds(dt) {

      flock.on = true; flock.x = W + 40; flock.y = H * (.2 + Math.random() * .16); flock.v = 38 + Math.random() * 20;
      flock.m = []; const n = 5 + Math.floor(Math.random() * 5);
      for (let i = 0; i < n; i++) { const k = Math.ceil(i / 2) * (i % 2 ? 1 : -1); flock.m.push({ dx: Math.abs(k) * 16 + Math.random() * 6, dy: k * 9 + Math.random() * 4, ph: Math.random() * 6 }); }

  const sc = H / 900;

    const x = flock.x + b.dx * sc, y = flock.y + b.dy * sc + Math.sin(state.t * .8 + b.ph) * 2, f = Math.sin(state.t * 7 + b.ph) * .55, s = 5 * sc;

}

function lumOf(c) {

  const L = new Float32Array(c.width * c.height);

}

  for (let y = 0; y < h; y += 3) v.push(L[y * w], L[y * w + w - 1]);

/* 絵を切り出し: 墨の層(白→透明) と 紙の下地(人物の内側) を作る */
function cutFrame(L, W0, box, bg) {
  const cut = bg - 22;
  const Lv = (x, y) => L[y * W0 + x];
  let [bx0, by0, bx1, by1] = box, x0 = bx1, y0 = by1, x1 = bx0, y1 = by0;
  for (let y = by0; y < by1; y++) for (let x = bx0; x < bx1; x++) if (Lv(x, y) < cut) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }

const RIG = { ready: false };
async function buildRig() {
  const load = b64 => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = 'data:image/png;base64,' + b64; });
  const [bi, fi, si] = await Promise.all([load(RIG_DATA.body), load(RIG_DATA.foot), load(SIT_DATA.img)]);
  const tex = im => {
    const c = toCanvas(im), L = lumOf(c), bg = bgLevel(L, c.width, c.height);
    const f = cutFrame(L, c.width, [0, 0, c.width, c.height], bg);
    const t = mk(f.w, f.h), g = t.getContext('2d');
    g.drawImage(f.under, 0, 0); g.drawImage(f.ink, 0, 0);
    return { c: t, ox: f.ox, oy: f.oy };
  };
  RIG.body = tex(bi); RIG.foot = tex(fi); RIG.m = RIG_DATA.meta;

function texTri(g, img, s0, s1, s2, d0, d1, d2, grow) {
  const [sx0, sy0] = s0, [sx1, sy1] = s1, [sx2, sy2] = s2, [dx0, dy0] = d0, [dx1, dy1] = d1, [dx2, dy2] = d2;
  const den = sx0 * (sy2 - sy1) - sx1 * sy2 + sx2 * sy1 + (sx1 - sx2) * sy0;
  if (!den) return;
  const a = -(sy0 * (dx2 - dx1) - sy1 * dx2 + sy2 * dx1 + (sy1 - sy2) * dx0) / den;
  const b = (sy1 * dy2 + sy0 * (dy1 - dy2) - sy2 * dy1 + (sy2 - sy1) * dy0) / den;
  const c = (sx0 * (dx2 - dx1) - sx1 * dx2 + sx2 * dx1 + (sx1 - sx2) * dx0) / den;
  const d = -(sx1 * dy2 + sx0 * (dy1 - dy2) - sx2 * dy1 + (sx2 - sx1) * dy0) / den;
  const e = (sx0 * (sy2 * dx1 - sy1 * dx2) + sy0 * (sx1 * dx2 - sx2 * dx1) + (sx2 * sy1 - sx1 * sy2) * dx0) / den;
  const f = (sx0 * (sy2 * dy1 - sy1 * dy2) + sy0 * (sx1 * dy2 - sx2 * dy1) + (sx2 * sy1 - sx1 * sy2) * dy0) / den;

  const gp = p => { const vx = p[0] - cx, vy = p[1] - cy, l = Math.hypot(vx, vy) || 1; return [p[0] + vx / l * grow, p[1] + vy / l * grow]; };
  const q0 = gp(d0), q1 = gp(d1), q2 = gp(d2);

  const bw = Math.min(img.width, Math.ceil(Math.max(sx0, sx1, sx2)) + 2) - bx, bh = Math.min(img.height, Math.ceil(Math.max(sy0, sy1, sy2)) + 2) - by;
  if (bw <= 0 || bh <= 0) return;
  g.save();
  g.beginPath(); g.moveTo(q0[0], q0[1]); g.lineTo(q1[0], q1[1]); g.lineTo(q2[0], q2[1]); g.closePath(); g.clip();
  g.transform(a, b, c, d, e, f);
  g.drawImage(img, bx, by, bw, bh, bx, by, bw, bh);

}

let last = performance.now(), rz;
